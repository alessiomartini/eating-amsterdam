<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Eating Amsterdam — good food, small budget</title>
<meta name="description" content="Community map of cheap fast food, döner and restaurants in Amsterdam and around, with real prices for six reference items and vegetarian/vegan filters." />
<meta name="color-scheme" content="dark light" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥙</text></svg>" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<header class="topbar">
  <h1><span aria-hidden="true">🥙</span> Eating Amsterdam</h1>
  <p class="tagline">Good food, small budget</p>
  <div class="topbar-actions">
    <button type="button" id="btn-locate" class="ghost" title="Centre the map on my location">📍 Near me</button>
    <button type="button" id="btn-data" class="ghost" title="Import, export and refresh data">⚙️ Data</button>
  </div>
</header>

<main class="layout" id="layout">
  <aside class="sidebar" id="sidebar">
    <form class="filters" id="filters" autocomplete="off">
      <div class="field">
        <input type="search" id="f-query" placeholder="Search name, cuisine, street…" aria-label="Search" />
      </div>

      <div class="field">
        <label for="f-priceitem">Price of</label>
        <select id="f-priceitem"></select>
      </div>

      <div class="field">
        <label for="f-maxprice">Max price: <output id="f-maxprice-out">any</output></label>
        <input type="range" id="f-maxprice" min="1" max="41" step="1" value="41" />
        <div class="chips">
          <label class="chip"><input type="checkbox" id="f-estimates" checked /><span>Include estimates</span></label>
          <label class="chip"><input type="checkbox" id="f-measured" /><span>✓ Real prices only</span></label>
        </div>
      </div>

      <fieldset class="field">
        <legend>Diet</legend>
        <div class="chips">
          <label class="chip"><input type="checkbox" id="f-vegetarian" /><span>🥗 Vegetarian</span></label>
          <label class="chip"><input type="checkbox" id="f-vegan" /><span>🌱 Vegan</span></label>
          <label class="chip"><input type="checkbox" id="f-veg-strict" /><span>Verified tags only</span></label>
        </div>
      </fieldset>

      <details class="more" id="more-filters">
        <summary>More filters <span id="more-count" class="badge" hidden></span></summary>
        <div class="field">
          <label for="f-minrating">Minimum rating: <output id="f-minrating-out">any</output></label>
          <input type="range" id="f-minrating" min="0" max="5" step="0.5" value="0" />
        </div>

        <fieldset class="field">
          <legend>Place type</legend>
          <div class="chips" id="f-categories"></div>
        </fieldset>

        <fieldset class="field">
          <legend>Cuisine</legend>
          <div class="chips" id="f-cuisines"></div>
        </fieldset>

        <fieldset class="field">
          <legend>Other</legend>
          <div class="chips">
            <label class="chip"><input type="checkbox" id="f-open" /><span>🕒 Open now</span></label>
            <label class="chip"><input type="checkbox" id="f-fav" /><span>⭐ Favourites</span></label>
          </div>
        </fieldset>
      </details>

      <div class="field row">
        <label for="f-sort">Sort by</label>
        <select id="f-sort">
          <option value="price">Price</option>
          <option value="rating">Rating</option>
          <option value="distance">Distance</option>
          <option value="name">Name</option>
        </select>
        <button type="button" id="btn-reset" class="ghost">Reset</button>
      </div>
    </form>

    <div class="results-head">
      <span id="results-count">Loading…</span>
      <button type="button" id="btn-add" class="ghost small">+ Add a place</button>
    </div>
    <ul class="results" id="results"></ul>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-legend" id="map-legend" hidden>
      <span><i class="dot cheap"></i> ≤ €10</span>
      <span><i class="dot mid"></i> €10–18</span>
      <span><i class="dot pricey"></i> &gt; €18</span>
      <span><i class="dot unknown"></i> no price</span>
    </div>
  </div>
</main>

<nav class="mobile-tabs" id="mobile-tabs">
  <button type="button" data-view="list" class="active">List</button>
  <button type="button" data-view="map">Map</button>
</nav>

<dialog id="detail" class="sheet"></dialog>
<dialog id="modal" class="sheet"></dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
