name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  # I push fatti col GITHUB_TOKEN (quelli del workflow "Aggiorna dati OSM") non
  # innescano altri workflow, quindi senza questo il sito continuerebbe a
  # servire il dataset vecchio dopo ogni rinfresco automatico.
  workflow_run:
    workflows: ["Aggiorna dati OSM"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # su workflow_run non ha senso ripubblicare se il rinfresco è fallito
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # marca gli asset con un hash: chi ha già visitato il sito riceve la
      # versione nuova invece di quella in cache
      - name: Applica la versione agli asset
        run: node scripts/stamp-version.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
